name: Validate and update mechanics
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * *'
  push:
    branches: [main]
    paths: ['mechanics/**', 'scripts/mechanics/**', '.github/workflows/mechanics.yml']
  pull_request:
    paths: ['mechanics/**', 'scripts/mechanics/**', '.github/workflows/mechanics.yml']

permissions:
  contents: read
concurrency:
  group: mechanics-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      parent: ${{ steps.previous.outputs.parent }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source adapters and public lookup
        run: node --test mechanics/test/*.test.mjs
      - name: Pin upstream revision
        id: upstream
        shell: bash
        run: |
          set -eu -o pipefail
          revision=$(git ls-remote --exit-code https://github.com/swgoh-utils/gamedata.git refs/heads/main | cut -f1)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mechanics-raw
          key: mechanics-source-v1-${{ steps.upstream.outputs.revision }}
          restore-keys: mechanics-source-v1-
      - name: Read the last published manifest
        if: github.event_name != 'pull_request'
        id: previous
        shell: bash
        run: |
          set -eu -o pipefail
          parent=$(git ls-remote origin refs/heads/mechanics-db-v1 | cut -f1)
          if [[ -n "$parent" ]]; then
            [[ "$parent" =~ ^[a-f0-9]{40}$ ]]
            curl --fail --silent --show-error --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$parent/manifest.json" -o "$RUNNER_TEMP/previous-mechanics.json"
          fi
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
      - name: Normalize and verify a complete snapshot
        id: build
        env:
          REVISION: ${{ steps.upstream.outputs.revision }}
        shell: bash
        run: |
          set -eu -o pipefail
          node scripts/mechanics/update.mjs --revision "$REVISION" --cache "$RUNNER_TEMP/mechanics-raw" --out "$RUNNER_TEMP/mechanics-db" --previous-manifest "$RUNNER_TEMP/previous-mechanics.json"
          if [[ -f "$RUNNER_TEMP/mechanics-db/manifest.json" ]]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.changed == 'true'
        with:
          name: normalized-mechanics
          path: ${{ runner.temp }}/mechanics-db/
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: normalized-mechanics
          path: ${{ runner.temp }}/mechanics-db
      - name: Publish verified files to the dedicated data branch
        env:
          PREVIOUS: ${{ needs.build.outputs.parent }}
        shell: bash
        run: |
          set -eu -o pipefail
          db="$RUNNER_TEMP/mechanics-db"
          node scripts/mechanics/update.mjs --verify --out "$db"
          parents=()
          if [[ -n "$PREVIOUS" ]]; then
            git fetch --no-tags --depth=1 origin refs/heads/mechanics-db-v1
            test "$(git rev-parse FETCH_HEAD)" = "$PREVIOUS"
            parents=(-p "$PREVIOUS")
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/mechanics.index"
          git read-tree --empty
          git --work-tree="$db" -C "$GITHUB_WORKSPACE" add --all -- "$db"
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" "${parents[@]}" -m 'Publish verified SWGOH mechanics')
          git push origin "$commit:refs/heads/mechanics-db-v1"
